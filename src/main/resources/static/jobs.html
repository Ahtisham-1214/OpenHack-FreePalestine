<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Manage Services</title>
<style>
  :root {
    --bg: #eef3f1;
    --card: #ffffff;
    --ink: #1c2b27;
    --muted: #5d706a;
    --accent: #0b3d91;
    --accent-dark: #082d6b;
    --line: #dbe3ec;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #ffffff;
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    padding: 32px 20px;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    padding: 40px 34px;
    border-radius: 24px;
    border: none;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .28);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: -.3px;
    color: #0b3d91;
  }
  h2 { margin: 30px 0 12px; font-size: 1.1rem; }
  p  { margin: 0 0 26px; color: var(--muted); }
  label {
    display: block;
    margin-bottom: 8px;
    font-size: .85rem;
    font-weight: 600;
    color: #334155;
  }
  .field { margin-bottom: 20px; }
  .hint { margin: 8px 0 0; font-size: .82rem; color: var(--muted); }

  input {
    width: 100%;
    padding: 14px 16px;
    font-size: 1rem;
    color: var(--ink);
    background: #f8fafc;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input:hover { border-color: #a9b8cc; }
  input:focus {
    outline: none;
    background: #fff;
    border-color: #1565c0;
    box-shadow: 0 0 0 4px rgba(21, 101, 192, .15);
  }

  .time-row { display: flex; align-items: center; gap: 12px; }
  .time-row input { flex: 1; }
  .time-row span { color: var(--muted); font-size: .95rem; }

  .primary {
    width: 100%;
    padding: 15px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(11, 61, 145, .3);
    transition: background .2s, transform .15s, box-shadow .2s;
  }
  .primary:hover {
    background: var(--accent-dark);
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(11, 61, 145, .38);
  }
  .primary:active { transform: translateY(0) scale(.99); }

  #msg { margin-top: 12px; min-height: 1.4em; font-weight: 600; color: var(--accent); }
  #msg.error { color: var(--danger); }

  ul { list-style: none; margin: 24px 0 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    background: #f8fafc;
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 10px;
    transition: box-shadow .2s, transform .15s;
  }
  li:hover { box-shadow: 0 6px 16px rgba(15, 40, 90, .1); transform: translateY(-1px); }
  li .name { font-weight: 600; }
  li .time { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .remove {
    background: #fff;
    border: 1.5px solid #f0c9c6;
    color: var(--danger);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    font-size: .85rem;
    font-weight: 600;
    transition: background .2s, border-color .2s;
  }
  .remove:hover { background: #fdecea; border-color: var(--danger); }
  .empty { color: var(--muted); justify-content: center; }

    .card-logo {
    display: block;
    width: 80px;
    height: 80px;
    object-fit: contain;
    margin: 0 auto 18px;
  }
</style>
</head>
<body>
<main class="card">
    <img src="logo.png" alt="Free Palestine Bank" class="card-logo">
  <h1>Create new service</h1>
  <p>Add a service and how long it takes to complete.</p>

  <div class="field">
    <label for="sname">Service name</label>
    <input type="text" id="sname" placeholder="e.g. Utility bills" autocomplete="off">
  </div>

  <div class="field">
    <label for="stime">Service time</label>
    <div class="time-row">
      <input type="number" id="stime" min="0.1" step="0.1" placeholder="e.g. 1.5">
      <span>minutes</span>
    </div>
    <p class="hint">Use decimals for part minutes, for example 1 or 1.5.</p>
  </div>

  <button type="button" class="primary" id="add">Create service</button>
  <div id="msg" aria-live="polite"></div>

  <ul id="list"></ul>
</main>

<!-- Include your toast and api wrappers first -->
<script src="/js/toast.js"></script>
<script src="/js/api.js"></script>

<script>
  let services = [];

  // Fetch existing services from the Spring Boot backend on load
  async function fetchServices() {
    try {
      // Calls GET /jobs
      services = await apiRequest('/jobs');
      render();
    } catch (error) {
      console.error("Failed to load services", error);
    }
  }

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    if (!services || services.length === 0) {
      list.innerHTML = '<li class="empty">No services yet. Create the first one above.</li>';
      return;
    }

    services.forEach(function (s) {
      const li = document.createElement("li");
      const info = document.createElement("div");

      const n = document.createElement("div");
      n.className = "name";
      // Matches your JobResponseDto fields (assuming 'job' and 'time')
      n.textContent = s.job;

      const t = document.createElement("div");
      t.className = "time";
      t.textContent = s.time + " min";

      info.appendChild(n);
      info.appendChild(t);

      const b = document.createElement("button");
      b.type = "button";
      b.className = "remove";
      b.textContent = "Remove";
      b.addEventListener("click", async function () {
        try {
          // Calls DELETE /jobs/{id}
          await apiRequest(`/jobs/${s.id}`, { method: 'DELETE' });
          Toast.success("Service removed successfully.", "Deleted");
          await fetchServices(); // Refresh list from backend
        } catch (error) {
          console.error("Failed to delete service", error);
        }
      });

      li.appendChild(info);
      li.appendChild(b);
      list.appendChild(li);
    });
  }

  document.getElementById("add").addEventListener("click", async function () {
    const jobInput = document.getElementById("sname").value.trim();
    const timeInput = parseFloat(document.getElementById("stime").value);

    if (!jobInput) {
      Toast.error("Please enter a service name.", "Validation Error");
      return;
    }
    if (!(timeInput > 0)) {
      Toast.error("Please enter a service time greater than 0.", "Validation Error");
      return;
    }

    // Check client-side for duplication against current list state
    const dup = services.some(function (s) {
      return s.job.toLowerCase() === jobInput.toLowerCase();
    });
    if (dup) {
      Toast.error("This service already exists.", "Duplicate");
      return;
    }

    // Payload matching JobRequestDto { String job; double time; }
    const payload = {
      job: jobInput,
      time: timeInput
    };

    try {
      // Calls POST /jobs
      await apiRequest('/jobs', {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      Toast.success("Service created successfully.", "Success");

      // Clear inputs and refocus
      document.getElementById("sname").value = "";
      document.getElementById("stime").value = "";
      document.getElementById("sname").focus();

      // Reload data from backend
      await fetchServices();

    } catch (error) {
      console.error("Failed to create service", error);
    }
  });

  // Initial load
  fetchServices();
</script>
</body>
</html>
