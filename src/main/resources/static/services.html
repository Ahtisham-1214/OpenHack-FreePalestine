<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bank Services</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Custom select arrow styling for clean minimalist look */
    .select-wrap select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1.1rem;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6 selection:bg-white selection:text-blue-600" style="background: linear-gradient(135deg, #0b3d91, #1565c0 60%, #42a5f5);">
<main class="card w-full max-w-md bg-white border border-slate-200/80 rounded-2xl p-8 shadow-xl shadow-slate-200/50">

  <!-- Header Section -->
  <div class="mb-6">
    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center mb-4 text-lg font-semibold">
      <i class="fa-solid fa-building-columns"></i>
    </div>
    <h1 class="text-2xl font-bold tracking-tight text-[#0b3d91]">Select a service</h1>
    <p class="text-slate-500 text-sm mt-1">Choose what you need help with.</p>
  </div>

  <div class="space-y-5">

    <!-- Name Field -->
    <div class="field space-y-2">
      <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-slate-600">Your name</label>
      <input type="text" id="name" placeholder="Enter your full name" autocomplete="name"
             class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition-all duration-150">
    </div>

    <!-- Service Selection Field -->
    <div class="space-y-2">
      <label for="service" class="block text-xs font-semibold uppercase tracking-wider text-slate-600">Service</label>
      <div class="select-wrap relative">
        <select id="service"
                class="w-full px-4 py-3 pr-10 bg-white border border-slate-300 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition-all duration-150 cursor-pointer">
          <option value="" disabled selected>Loading services...</option>
        </select>
      </div>
    </div>

  </div>

  <!-- Action Button -->
  <button type="button" id="go"
class="mt-8 w-full py-3.5 px-6 bg-[#0b3d91] hover:bg-[#082d6b] text-white font-medium rounded-xl shadow-md shadow-blue-900/20 active:scale-[0.99] transition-all duration-150 text-sm cursor-pointer flex items-center justify-center space-x-2">
    <span>Continue</span>
    <i class="fa-solid fa-arrow-right text-xs"></i>
  </button>

  <!-- Result Container -->
  <div id="result" aria-live="polite" class="mt-4 text-xs font-medium text-center text-slate-500 empty:mt-0"></div>

</main>

<!-- Include your Toast and API wrapper scripts -->
<script src="/js/toast.js"></script>
<script src="/js/api.js"></script>

<script>
  // Fetch and populate the dropdown from the backend on page load
  async function loadServices() {
    const selectElement = document.getElementById("service");

    try {
      // Calls GET /jobs which returns List<JobResponseDto>
      const jobs = await apiRequest('/jobs');

      // Reset dropdown with default disabled prompt
      selectElement.innerHTML = '<option value="" disabled selected>Choose a service</option>';

      if (!jobs || jobs.length === 0) {
        const opt = document.createElement("option");
        opt.disabled = true;
        opt.textContent = "No services available";
        selectElement.appendChild(opt);
        return;
      }

      // Populate options dynamically from backend data
      jobs.forEach(job => {
        const option = document.createElement("option");
        // Set value to job.job (the String name) so it matches ServiceRequestDto's service field
        option.value = job.job;
        option.textContent = job.job;
        selectElement.appendChild(option);
      });

    } catch (error) {
      console.error("Failed to load services:", error);
      selectElement.innerHTML = '<option value="" disabled selected>Error loading services</option>';
    }
  }

  // Handle form submission / continue action
  document.getElementById("go").addEventListener("click", async function () {
    const serviceSelect = document.getElementById("service");
    const nameInput = document.getElementById("name").value.trim();
    const resultDiv = document.getElementById("result");

    if (!nameInput) {
      Toast.info("Please enter your name.", "Validation Error");
      return;
    }

    if (!serviceSelect.value) {
      Toast.info("Please choose a service.", "Validation Error");
      return;
    }

    // Payload matching ServiceRequestDto { String name; String service; }
    const payload = {
      name: nameInput,
      service: serviceSelect.value
    };

    try {
      // Calls POST /services on your Spring Boot backend
      const response = await apiRequest('/services', {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      Toast.success("Service requested successfully!", "Success");

      // Optional: Clear form inputs after success
      document.getElementById("name").value = "";
      serviceSelect.selectedIndex = 0;

    } catch (error) {
      console.error("Failed to submit service request:", error);
    }
  });

  // Load jobs when the page loads
  loadServices();
</script>
</body>
</html>
