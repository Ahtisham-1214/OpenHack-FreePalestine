<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bank Services & Token Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .select-wrap select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1.1rem;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6 selection:bg-blue-600 selection:text-white">

<main class="card w-full max-w-md bg-white border border-slate-200/80 rounded-2xl p-8 shadow-xl shadow-slate-200/50">

  <!-- Dynamic Content Container -->
  <div id="appContainer">
    <!-- Header Section -->
    <div class="mb-6">
      <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center mb-4 text-lg font-semibold">
        <i class="fa-solid fa-building-columns"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">Select a service</h1>
      <p class="text-slate-500 text-sm mt-1">Choose what you need help with.</p>
    </div>

    <div class="space-y-5">
      <!-- Name Field -->
      <div class="field space-y-2">
        <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-slate-600">Your name</label>
        <input type="text" id="name" placeholder="Enter your full name" autocomplete="name"
               class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition-all duration-150">
      </div>

      <!-- Service Selection Field -->
      <div class="space-y-2">
        <label for="service" class="block text-xs font-semibold uppercase tracking-wider text-slate-600">Service</label>
        <div class="select-wrap relative">
          <select id="service"
                  class="w-full px-4 py-3 pr-10 bg-white border border-slate-300 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition-all duration-150 cursor-pointer">
            <option value="" disabled selected>Loading services...</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Action Button -->
    <button type="button" id="go"
            class="mt-8 w-full py-3.5 px-6 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl shadow-md shadow-blue-600/20 active:scale-[0.99] transition-all duration-150 text-sm cursor-pointer flex items-center justify-center space-x-2">
      <span>Continue</span>
      <i class="fa-solid fa-arrow-right text-xs"></i>
    </button>
  </div>

  <!-- Result Container -->
  <div id="result" aria-live="polite" class="mt-4 text-xs font-medium text-center text-slate-500 empty:mt-0"></div>

</main>

<!-- Include your Toast and API wrapper scripts -->
<script src="/js/toast.js"></script>
<script src="/js/api.js"></script>

<script>
  let activeTokenId = null;
  let pollInterval = null;

  // Fetch and populate the dropdown from the backend on page load
  async function loadServices() {
    const selectElement = document.getElementById("service");

    try {
      const jobs = await apiRequest('/jobs', { allowUnauthorized: true });
      selectElement.innerHTML = '<option value="" disabled selected>Choose a service</option>';

      if (!jobs || jobs.length === 0) {
        const opt = document.createElement("option");
        opt.disabled = true;
        opt.textContent = "No services available";
        selectElement.appendChild(opt);
        return;
      }

      jobs.forEach(job => {
        const option = document.createElement("option");
        option.value = job.job;
        option.textContent = `${job.job} (~${job.time} mins)`;
        selectElement.appendChild(option);
      });

    } catch (error) {
      console.error("Failed to load services:", error);
      selectElement.innerHTML = '<option value="" disabled selected>Error loading services</option>';
    }
  }

  // Handle form submission / continue action
  document.addEventListener("click", async function (e) {
    if (e.target && e.target.id === "go") {
      const serviceSelect = document.getElementById("service");
      const nameInput = document.getElementById("name").value.trim();

      if (!nameInput) {
        Toast.info("Please enter your name.", "Validation Error");
        return;
      }

      if (!serviceSelect.value) {
        Toast.info("Please choose a service.", "Validation Error");
        return;
      }

      const payload = {
        name: nameInput,
        service: serviceSelect.value
      };

      try {
        const response = await apiRequest('/services', {
          method: 'POST',
          body: JSON.stringify(payload),
          allowUnauthorized: true
        });

        activeTokenId = response.id;
        Toast.success(`Token #${activeTokenId} Generated Successfully!`, "Success");

        // Transform card into the Live Tracker view
        renderTrackerView(response);
        startLiveTracker();

      } catch (error) {
        console.error("Failed to submit service request:", error);
      }
    }
  });

  // Switch card layout to display live queue metrics
  function renderTrackerView(token) {
    const container = document.getElementById('appContainer');
    container.innerHTML = `
      <div class="mb-6 text-center">
        <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-3 text-xl font-semibold shadow-inner">
          <i class="fa-solid fa-ticket"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Token #${token.id}</h1>
        <p class="text-slate-500 text-sm mt-1">Keep this screen open to monitor your live status.</p>
      </div>

      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 space-y-4">
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-500 font-medium">Service</span>
          <span class="text-slate-900 font-semibold">${token.service}</span>
        </div>
        <hr class="border-slate-200">
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-500 font-medium">People Ahead</span>
          <span class="text-blue-600 font-bold text-lg" id="trackerPosition">Loading...</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-500 font-medium">Est. Wait Time</span>
          <span class="text-slate-900 font-semibold" id="trackerWait">Loading...</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-500 font-medium">Status</span>
          <span class="px-2.5 py-1 bg-amber-100 text-amber-800 text-xs font-semibold rounded-full" id="trackerStatus">WAITING</span>
        </div>
      </div>

      <button type="button" id="cancelBtn"
              class="mt-6 w-full py-3 px-6 bg-red-50 hover:bg-red-100 text-red-600 font-medium rounded-xl border border-red-200 transition-all duration-150 text-sm cursor-pointer flex items-center justify-center space-x-2">
        <i class="fa-solid fa-xmark"></i>
        <span>Cancel Token</span>
      </button>
    `;

    document.getElementById('cancelBtn').addEventListener('click', cancelToken);
  }

  // Poll backend every 3 seconds for position updates and estimated wait countdown
  function startLiveTracker() {
    if (!activeTokenId) return;

    pollInterval = setInterval(async () => {
      try {
        const statusData = await apiRequest(`/services/status/${activeTokenId}`, { allowUnauthorized: true });

        const cancelBtn = document.getElementById('cancelBtn');

        if (statusData.status && statusData.status !== 'WAITING') {
          const statusBadge = document.getElementById('trackerStatus');
          statusBadge.textContent = statusData.status;

          // Update badge styling based on state
          // Update badge styling based on state
          if (statusData.status === 'SERVING') {
            statusBadge.className = 'px-2.5 py-1 bg-emerald-100 text-emerald-800 text-xs font-semibold rounded-full';
            Toast.success("It's your turn now! Please approach the counter.", "Your Turn!");

            // Keep cancel button visible while serving, in case they need to step away
            if (cancelBtn) cancelBtn.style.display = 'block';

          } else if (statusData.status === 'COMPLETED') {
            statusBadge.className = 'px-2.5 py-1 bg-blue-100 text-blue-800 text-xs font-semibold rounded-full';
            Toast.info("Your service has been completed. Thank you!", "Completed");

            // Hide cancel button only after completion
            if (cancelBtn) cancelBtn.style.display = 'none';
            clearInterval(pollInterval);
            return;

          } else if (statusData.status === 'CANCELLED') {
            statusBadge.className = 'px-2.5 py-1 bg-rose-100 text-rose-800 text-xs font-semibold rounded-full';
            if (cancelBtn) cancelBtn.style.display = 'none';
            clearInterval(pollInterval);
            return;
          }
        }

        document.getElementById('trackerPosition').textContent = statusData.positionInQueue;
        document.getElementById('trackerWait').textContent = `${statusData.estimatedWaitMinutes.toFixed(1)} mins`;
      } catch (err) {
        console.error("Polling error", err);
      }
    }, 3000);
  }

  // Cancel token action
  async function cancelToken() {
    if (!activeTokenId) return;
    try {
      await apiRequest(`/services/${activeTokenId}/status?status=CANCELLED`, { method: 'PATCH', allowUnauthorized: true });
      Toast.error("Your token has been cancelled.", "Cancelled");
      clearInterval(pollInterval);
      setTimeout(() => window.location.reload(), 1500);
    } catch (err) {
      console.error(err);
    }
  }

  // Load jobs on page load
  loadServices();
</script>
</body>
</html>
