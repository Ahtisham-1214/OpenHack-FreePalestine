<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.png">
<title>Bank Register</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0b3d91, #1565c0 60%, #42a5f5);
    padding: 16px;
  }

  /* Landscape card: logo on the left, form on the right */
  .card {
    background: #fff;
    width: 100%;
    max-width: 900px;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
    display: flex;
    overflow: hidden;
  }

  .brand-side {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: #fff;
    border-right: 1px solid #e6eaf0;
  }
  .brand-side img {
    width: 100%;
    max-width: 340px;
    height: auto;
    object-fit: contain;
  }

  .form-side {
    flex: 1;
    padding: 36px 32px;
  }

  .subtitle {
    text-align: center;
    color: #0b3d91;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 28px;
  }

  .field { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 6px;
  }
  .input-wrap { position: relative; }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #ccd3dd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus {
    border-color: #1565c0;
    box-shadow: 0 0 0 3px rgba(21,101,192,.15);
  }
  input.invalid { border-color: #d32f2f; }
  input.valid { border-color: #2e7d32; }
  .error {
    color: #d32f2f;
    font-size: 12px;
    margin-top: 5px;
    min-height: 14px;
  }

  .toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #1565c0;
    font-size: 13px;
    cursor: pointer;
  }

  a { color: #1565c0; text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }

  .btn {
    width: 100%;
    padding: 13px;
    background: #0b3d91;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
    margin-top: 4px;
  }
  .btn:hover { background: #082d6b; }
  .btn:disabled { background: #90a4c4; cursor: not-allowed; }

  .message {
    text-align: center;
    font-size: 13px;
    margin-top: 14px;
    min-height: 18px;
  }
  .message.ok { color: #2e7d32; }
  .message.fail { color: #d32f2f; }

  .switch {
    text-align: center;
    font-size: 13px;
    color: #555;
    margin-top: 20px;
  }

  .secure {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-top: 22px;
  }

  /* Mobile: stack logo on top, form below */
  @media (max-width: 720px) {
    .card { flex-direction: column; max-width: 420px; }
    .brand-side {
      border-right: none;
      border-bottom: 1px solid #e6eaf0;
      padding: 24px;
    }
    .brand-side img { max-width: 200px; }
    .form-side { padding: 28px 24px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand-side">
    <img src="logo.png" alt="Free Palestine Bank">
  </div>

  <div class="form-side">
    <div class="subtitle">Create your account</div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a username" autocomplete="username" maxlength="50">
        <div class="error" id="usernameError"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Create a password" autocomplete="new-password">
          <button type="button" class="toggle" id="togglePwd">Show</button>
        </div>
        <div class="error" id="passwordError"></div>
      </div>

      <button type="submit" class="btn" id="registerBtn">Register</button>
      <div class="message" id="registerMsg"></div>
    </form>

    <div class="switch">Already have an account? <a href="login.html">Login</a></div>
    <div class="secure">🔒 Your information is secure</div>
  </div>
</div>

<script>
  /* =========================================================
     VALIDATION RULES (all handled on the frontend)
     Each validator returns an error string, or '' if valid.
     ========================================================= */
  const validate = {
    // Username: letters + numbers only, must contain both
    username(value) {
      if (!value) return 'Username is required';
      if (/\s/.test(value)) return 'Username must not contain spaces';
      if (!/^[A-Za-z0-9]+$/.test(value)) return 'Username can only contain letters and numbers (no special characters)';
      if (!/[A-Za-z]/.test(value)) return 'Username must include at least one letter';
      if (!/[0-9]/.test(value)) return 'Username must include at least one number';
      return '';
    },

    password(value) {
      if (!value) return 'Password is required';
      if (/\s/.test(value)) return 'Password must not contain spaces';
      if (value.length < 8) return 'Password must be at least 8 characters';
      if (value.length > 64) return 'Password must be 64 characters or fewer';
      if (!/[a-z]/.test(value)) return 'Password must include a lowercase letter';
      if (!/[A-Z]/.test(value)) return 'Password must include an uppercase letter';
      if (!/[0-9]/.test(value)) return 'Password must include a number';
      if (!/[^A-Za-z0-9]/.test(value)) return 'Password must include a special character (e.g. @, #, !)';
      return '';
    }
  };

  // Validate on blur first, then live while typing
  function liveValidate(input, check) {
    let touched = false;
    input.addEventListener('blur', () => { touched = true; check(); });
    input.addEventListener('input', () => { if (touched) check(); });
  }

  const form        = document.getElementById('registerForm');
  const usernameInput = document.getElementById('username');
  const pwdInput    = document.getElementById('password');
  const usernameError = document.getElementById('usernameError');
  const pwdError    = document.getElementById('passwordError');
  const registerMsg = document.getElementById('registerMsg');
  const registerBtn = document.getElementById('registerBtn');
  const togglePwd   = document.getElementById('togglePwd');

  function setError(input, errEl, text) {
    errEl.textContent = text;
    input.classList.toggle('invalid', !!text);
    input.classList.toggle('valid', !text && input.value !== '');
    return !text;
  }

  const checkUsername = () => setError(usernameInput, usernameError, validate.username(usernameInput.value.trim()));
  const checkPassword = () => setError(pwdInput, pwdError, validate.password(pwdInput.value));

  liveValidate(usernameInput, checkUsername);
  liveValidate(pwdInput, checkPassword);

  // Show / hide password
  togglePwd.addEventListener('click', () => {
    const hidden = pwdInput.type === 'password';
    pwdInput.type = hidden ? 'text' : 'password';
    togglePwd.textContent = hidden ? 'Hide' : 'Show';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    registerMsg.textContent = '';
    registerMsg.className = 'message';

    // Run all checks so every error shows at once
    const usernameOk = checkUsername();
    const pwdOk      = checkPassword();
    if (!usernameOk || !pwdOk) return;

    const username = usernameInput.value.trim();
    const password = pwdInput.value;

    registerBtn.disabled = true;
    registerBtn.textContent = 'Creating account...';

    try {
      // TODO: Replace with your server URL.
      // Passwords must be hashed and stored securely on the server (over HTTPS).
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        registerMsg.textContent = 'Account created! Redirecting to login...';
        registerMsg.classList.add('ok');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      } else if (res.status === 409) {
        registerMsg.textContent = 'This username is already taken';
        registerMsg.classList.add('fail');
      } else {
        registerMsg.textContent = 'Registration failed. Please try again.';
        registerMsg.classList.add('fail');
      }
    } catch (err) {
      registerMsg.textContent = 'Unable to connect to the server';
      registerMsg.classList.add('fail');
    } finally {
      registerBtn.disabled = false;
      registerBtn.textContent = 'Register';
    }
  });
</script>
</body>
</html>
