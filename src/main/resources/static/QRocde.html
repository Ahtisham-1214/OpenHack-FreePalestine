<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan QR Code</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0b3d91, #1565c0 60%, #42a5f5);
    padding: 16px;
  }

  .card {
    background: #fff;
    width: 100%;
    max-width: 400px;
    border-radius: 14px;
    padding: 36px 32px;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
    text-align: center;
  }

  .logo {
    font-size: 26px;
    font-weight: 700;
    color: #0b3d91;
    margin-bottom: 6px;
  }
  .subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 24px;
  }

  /* QR image with a transparent button on top of it */
  .qr-box {
    position: relative;
    display: inline-block;
    width: 232px;
    height: 232px;
    padding: 12px;
    border: 2px dashed #ccd3dd;
    border-radius: 12px;
    background: #fff;
    margin-bottom: 20px;
  }
  .qr-box img {
    display: block;
    width: 200px;
    height: 200px;
  }
  .qr-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 200px;      /* same size as the QR image */
    height: 200px;
    background: transparent;
    border: none;
    outline: none;
    cursor: pointer;
  }

  .scan-text {
    font-size: 18px;
    font-weight: 600;
    color: #0b3d91;
    margin-bottom: 8px;
  }
  .hint {
    font-size: 13px;
    color: #666;
    margin-bottom: 8px;
  }

  a { color: #1565c0; text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }

  .switch {
    font-size: 13px;
    color: #555;
    margin-top: 16px;
  }

  .secure {
    font-size: 12px;
    color: #888;
    margin-top: 22px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">My Bank</div>
  <div class="subtitle">Secure token verification</div>

  <div class="qr-box">
    <img src="qr.png" alt="QR code">
    <!-- Transparent button, same size as the QR image -->
    <button type="button" class="qr-btn" id="qrBtn" aria-label="Open job and admin page"></button>
  </div>

  <div class="scan-text">Scan QR code for token</div>
  <div class="hint">After scanning, you will be taken to the next page.</div>

  <div class="switch">Back to <a href="login.html">Login</a></div>
  <div class="secure">🔒 Your information is secure</div>
</div>

<script>
  // Clicking the QR code opens job_and_admin.html
  document.getElementById('qrBtn').addEventListener('click', () => {
    window.location.href = 'job_and_time.html';
  });
</script>
</body>
</html>
