<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Operator Dashboard - Queue Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/footer.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6">

<div class="max-w-6xl mx-auto space-y-6">

    <!-- Logo (centered) -->
    <div class="flex justify-center pt-4">
        <img src="logo.png" alt="Free Palestine Bank" class="w-20 h-20 object-contain">
    </div>

    <!-- Header -->
    <div class="flex justify-between items-center bg-white border border-slate-200/80 p-6 rounded-2xl shadow-sm">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Operator Dashboard</h1>
            <p class="text-slate-500 text-sm mt-1">Manage live queue tokens, service states, and operational metrics.</p>
        </div>
        <form action="/logout" method="POST" style="margin:0;">
            <button type="submit" class="px-4 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 font-medium rounded-xl border border-red-200 transition-all text-sm cursor-pointer flex items-center space-x-2">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </button>
        </form>
    </div>

    <!-- Analytics Cards Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
        <div class="bg-white border border-slate-200/80 p-5 rounded-2xl shadow-sm">
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Waiting Queue</p>
            <p id="statWaiting" class="text-3xl font-bold text-blue-600 mt-2">0</p>
        </div>
        <div class="bg-white border border-slate-200/80 p-5 rounded-2xl shadow-sm">
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Currently Serving</p>
            <p id="statServing" class="text-3xl font-bold text-amber-600 mt-2">0</p>
        </div>
        <div class="bg-white border border-slate-200/80 p-5 rounded-2xl shadow-sm">
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Completed Tokens</p>
            <p id="statCompleted" class="text-3xl font-bold text-emerald-600 mt-2">0</p>
        </div>
        <div class="bg-white border border-slate-200/80 p-5 rounded-2xl shadow-sm">
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Cancelled Tokens</p>
            <p id="statCancelled" class="text-3xl font-bold text-rose-600 mt-2">0</p>
        </div>
    </div>

    <!-- Live Queue Table Section -->
    <div class="bg-white border border-slate-200/80 rounded-2xl shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
            <h2 class="text-lg font-bold text-slate-900">Active & Recent Tokens</h2>
            <button onclick="fetchDashboardData()" class="text-xs font-semibold text-blue-600 hover:text-blue-700 flex items-center space-x-1 cursor-pointer">
                <i class="fa-solid fa-rotate"></i>
                <span>Refresh Now</span>
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                <tr class="bg-slate-50 text-slate-400 font-semibold uppercase text-xs tracking-wider border-b border-slate-100">
                    <th class="p-4">Token ID</th>
                    <th class="p-4">Citizen Name</th>
                    <th class="p-4">Service Required</th>
                    <th class="p-4">Est. Time</th>
                    <th class="p-4">Status</th>
                    <th class="p-4 text-right">Actions</th>
                </tr>
                </thead>
                <tbody id="queueTableBody" class="divide-y divide-slate-100 text-slate-700">
                <!-- Dynamically populated rows -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ================= DEVELOPER CREDIT ================= -->
<footer class="developer-credit">

    <a href="about.html" target="_blank" class="developer-link">

        <img src="/logo.png"
             alt="Free Palestine Team"
             class="developer-photo">

        <div class="developer-info">
            <span class="developer-label">Team</span>
            <strong class="developer-name">Free Palestine</strong>
        </div>

    </a>

</footer>

<script src="/js/toast.js"></script>
<script src="/js/api.js"></script>
<script>
    async function fetchDashboardData() {
        try {
            // Fetch Analytics & Full Token Ledger simultaneously
            const [analytics, queueItems] = await Promise.all([
                apiRequest('/services/analytics'),
                apiRequest('/services/all') // Fetches full token list
            ]);

            // Update Metrics Cards
            document.getElementById('statWaiting').textContent = analytics.activeQueueLength || 0;
            document.getElementById('statServing').textContent = analytics.currentlyServing || 0;
            document.getElementById('statCompleted').textContent = analytics.completedTokens || 0;
            document.getElementById('statCancelled').textContent = analytics.cancelledTokens || 0;

            const tbody = document.getElementById('queueTableBody');
            tbody.innerHTML = '';

            if (!queueItems || queueItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">No token records found.</td></tr>`;
                return;
            }

            queueItems.forEach(item => {
                let badgeColor = 'bg-blue-50 text-blue-700 border-blue-200';
                if (item.status === 'SERVING') badgeColor = 'bg-amber-50 text-amber-700 border-amber-200';
                if (item.status === 'COMPLETED') badgeColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                if (item.status === 'CANCELLED') badgeColor = 'bg-rose-50 text-rose-700 border-rose-200';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4 font-semibold text-slate-900">#${item.id}</td>
                    <td class="p-4 font-medium">${item.name}</td>
                    <td class="p-4 text-slate-600">${item.service}</td>
                    <td class="p-4 text-slate-500">${item.estimatedServiceTimeMinutes} mins</td>
                    <td class="p-4">
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full border ${badgeColor}">
                            ${item.status}
                        </span>
                    </td>
                    <td class="p-4 text-right space-x-2">
                        ${item.status === 'WAITING' ? `<button onclick="updateStatus(${item.id}, 'SERVING')" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-medium cursor-pointer transition-all">Serve</button>` : ''}
                        ${item.status !== 'COMPLETED' && item.status !== 'CANCELLED' ? `<button onclick="updateStatus(${item.id}, 'COMPLETED')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-medium cursor-pointer transition-all">Complete</button>` : ''}
                        <span class="text-xs text-slate-400 italic">${item.status === 'CANCELLED' ? 'Cancelled by User' : ''}</span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            console.error("Dashboard error:", err);
        }
    }

    async function updateStatus(id, status) {
        try {
            await apiRequest(`/services/${id}/status?status=${status}`, { method: 'PATCH' });
            Toast.success(`Token #${id} marked as ${status}`, "Status Updated");
            fetchDashboardData();
        } catch (err) {
            console.error(err);
        }
    }

    // Auto-refresh every 5 seconds
    fetchDashboardData();
    setInterval(fetchDashboardData, 2000);
</script>
</body>
</html>
