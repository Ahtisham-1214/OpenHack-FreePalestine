<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan QR Code</title>
  <link rel="stylesheet" href="css/footer.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    padding: 16px;
    flex-direction: column;
  }

  .card {
    background: #fff;
    width: 100%;
    max-width: 400px;
    border-radius: 14px;
    padding: 36px 32px;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
    text-align: center;
  }

  .logo-img {
    width: 80px;
    height: 80px;
    object-fit: contain;
    display: block;
    margin: 0 auto 12px;
  }

  .logo {
    font-size: 26px;
    font-weight: 700;
    color: #0b3d91;
    margin-bottom: 6px;
  }
  .subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 24px;
  }

  .qr-box {
    position: relative;
    display: inline-block;
    width: 232px;
    height: 232px;
    padding: 12px;
    border: 2px dashed #ccd3dd;
    border-radius: 12px;
    background: #fff;
    margin-bottom: 20px;
  }
  .qr-box img {
    display: block;
    width: 200px;
    height: 200px;
  }
  .qr-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 200px;
    height: 200px;
    background: transparent;
    border: none;
    outline: none;
    cursor: pointer;
  }

  .scan-text {
    font-size: 18px;
    font-weight: 600;
    color: #0b3d91;
    margin-bottom: 8px;
  }
  .hint {
    font-size: 13px;
    color: #666;
    margin-bottom: 8px;
  }

  .download-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 22px;
    padding: 13px 20px;
    background: #082d6b;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    border-radius: 12px;
    box-shadow: 0 6px 16px rgba(8,45,107,.25);
    text-decoration: none;
    transition: background .15s;
  }
  .download-btn:hover {
    background: #061f4a;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="card">
  <img src="logo.png" alt="Free Palestine Bank" class="logo-img">
  <div class="logo">Free Palestine Bank</div>
  <div class="subtitle">Secure token verification</div>

  <div class="qr-box">
    <img src="qr.png" alt="QR code">
    <button type="button" class="qr-btn" id="qrBtn" aria-label="Open job and admin page"></button>
  </div>

  <div class="scan-text">Scan QR code for token</div>
  <div class="hint">After scanning, you will be taken to the next page.</div>

  <a href="/qr.png" download="qr.png" class="download-btn">Download QR</a>
</div>

<!-- ================= DEVELOPER CREDIT ================= -->
<footer class="developer-credit">

  <a href="about.html" target="_blank" class="developer-link">

    <img src="/logo.png"
         alt="Free Palestine Team"
         class="developer-photo">

    <div class="developer-info">
      <span class="developer-label">Team</span>
      <strong class="developer-name">Free Palestine</strong>
    </div>

  </a>

</footer>

<script>
  document.getElementById('qrBtn').addEventListener('click', () => {
    window.location.href = 'services.html';
  });
</script>
</body>
</html>
